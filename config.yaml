# Конфигурация инструмента визуализации графа зависимостей

# Анализируемый пакет: groupId:artifactId:version (в тестовом режиме — буквы, например A)
packageName: com.google.guava:guava:33.0.0-jre
# URL Maven-репозитория (в тестовом режиме — путь к файлу тестового графа)
repository: https://repo1.maven.org/maven2
# Имя PNG-файла с изображением графа
outputFile: graph.png
# Пропускать пакеты, в имени которых есть эта подстрока (можно не указывать)
filter: test
# true — читать граф из тестового файла вместо настоящего репозитория
testMode: false
# true — вывести зависимости в виде ASCII-дерева
asciiTree: true
# Максимальная глубина анализа (не меньше 1)
maxDepth: 3
